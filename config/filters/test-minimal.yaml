# Minimal test filter - only 5 matches total
# For validating the filter system works end-to-end

filter:
  enabled: true
  name: "Test - Minimal (5 Matches)"
  description: "Tiny test filter - 5 matches for quick validation"

  # Just football
  sports:
    - football

  # Specific leagues (empty = all available for selected sports)
  leagues: []

  # Per-sport limits - VERY SMALL for fast testing
  limits:
    football: 5

  # Full analysis pipeline
  analysis:
    run_internet_picks: true
    run_data_driven: true
    run_synthesis: true

# Expected result: 5 football matches analyzed in ~3-5 minutes
# Good for: Validating filter system works before running larger analyses
