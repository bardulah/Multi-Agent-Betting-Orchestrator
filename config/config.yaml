# Multi-Agent Betting System Configuration

# Sports to scrape (football, hockey, basketball, tennis, baseball)
sports:
  - football
  - basketball
  - tennis
  - hockey
  - baseball

# Scraper settings
scraper:
  headless: true
  rate_limit_delay: 2000  # milliseconds between requests
  timeout: 30000  # page load timeout
  max_matches_per_sport: 50  # maximum matches to scrape per sport (set to 0 for unlimited)
  user_agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36"
  viewport:
    width: 1920
    height: 1080

# Agent settings
# Note: Google ADK's built-in google_search tool is FREE and requires only GOOGLE_API_KEY
agents:
  internet_picks:
    search_queries_per_match: 3
    max_sources: 5

  data_driven:
    search_queries_per_match: 4
    analysis_depth: "detailed"  # quick, standard, detailed

  synthesis:
    min_value_threshold: 1.05  # Minimum odds value to consider
    confidence_threshold: 0.7  # 0-1 scale for recommendation confidence

# Notification settings
notifications:
  enabled: true
  method: "both"  # email, telegram, or both

  email:
    smtp_server: "smtp.gmail.com"
    smtp_port: 587
    sender_email: "mtsaltnr@gmail.com"  # Your Gmail sender address
    recipient_email: "algordal@gmail.com"  # Where to send notifications
    # sender_password is read from EMAIL_PASSWORD environment variable

  telegram:
    # bot_token and chat_id are read from environment variables:
    # TELEGRAM_BOT_TOKEN and TELEGRAM_CHAT_ID

# Logging
logging:
  level: "DEBUG"  # DEBUG, INFO, WARNING, ERROR
  file: "logs/betting_system.log"
  max_bytes: 10485760  # 10MB
  backup_count: 5

# Scheduling
schedule:
  enabled: true
  time: "08:00"  # Daily run time (24-hour format)
  timezone: "UTC"

# Data storage
storage:
  matches_file: "data/matches.json"
  results_file: "data/results.json"
  history_file: "data/history.json"
